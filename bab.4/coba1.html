<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        /* selector Elemen - semua tag <h2> */
        h2 {
           color:#2E86C1;
           border-bottom: 2px selid #86cfff;
        }

        /* Selector Class - elemen yang punya Class='highlight' */
        .highlight {
            background-color: yellow;
            font-weight: bold;
        }

        /* selector ID - elemen dengan id 'hero' */
        #hero {
            background-color: #71c9ff;
            color: #000000;
            padding: 40px;
        }

        /* Grouping - terapkan gaya yang sama ke h1, h2, h3 */
        h1, h2, h3 {
            font-family: 'Georgia',serif;
            color: #0090e9;
        }

        /* Preudo-class - tautan saat di- hover */
        a:hover {
            color: red;
            text-decoration: underline;
        }
            
        
    </style>
</head>
<body> 
    <h1> SELAMAT DATANG </h1>
    <h2> REKAYASA PERANGKAT LUNAK </h2>

    <a href="#">X RPL 2</a>

    <p class="highlight">Andi Sukirno</p>

    <p id="hero">Bayu Kusuma</p>
</body>
</html>
